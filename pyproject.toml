[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.17",
    "fastapi>=0.143.3",
    "grpcio>=1.80.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.6.2",
    "langgraph>=1.0.0",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-vector-stores-milvus>=1.2.0",
    "modelscope>=1.40.2",
    "protobuf>=6.31.1",
    "pymilvus>=2.6.7,<3",
    "python-dotenv>=1.0.1",
    "snowflake-id>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.55",
    "uvicorn[standard]>=0.41.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "constants*", "domain*", "harness*", "config*", "infra*", "transport*"]


[tool.setuptools.package-data]
"*" = ["py.typed"]
"skills" = ["*/SKILL.md"]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
lint.ignore = ["D401", "UP006", "UP007", "UP035", "D417", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
